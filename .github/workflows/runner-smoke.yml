# Smoke do runner próprio (cantina-vps-01): checkout, versões, permissões de escrita e execução básica. NÃO roda a suíte e não
# usa segredos. Somente leitura sobre a VPS (scripts/ci/runner/validate.sh); serve também de inventário antes da migração.
# Dispara por push na main quando o smoke ou os scripts do runner mudam, e manualmente (workflow_dispatch).
name: runner-smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runner-smoke.yml
      - scripts/ci/runner/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, cantina-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Execução básica (identidade, relógio, variáveis do runner)
        run: |
          echo "usuário: $(id)"
          echo "host: $(hostname) · $(uname -srm)"
          echo "runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH}, ${RUNNER_ENVIRONMENT})"
          echo "workspace: $GITHUB_WORKSPACE · temp: $RUNNER_TEMP · tool cache: $RUNNER_TOOL_CACHE"
          echo "commit: $(git rev-parse --short HEAD)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Versões
        run: |
          node --version
          npm --version
          java -version 2>&1 | head -n 1
          git --version
      - name: Validação do runner (somente leitura)
        run: bash scripts/ci/runner/validate.sh base

  # Cadeia de ferramentas real (npm ci, emuladores/Java, Chromium, scanners, contêiner): é o que difere do Ubuntu hospedado.
  # Roda mesmo se o inventário acusar falta (serve de diagnóstico), mas NÃO executa nenhuma suíte de testes.
  toolchain:
    needs: smoke
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, linux, x64, cantina-ci]
    timeout-minutes: 30
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Validação da cadeia de ferramentas
        run: bash scripts/ci/runner/validate.sh toolchain

  # Ensaio do ci-metrics na máquina própria ANTES do merge: workflow_run usa a definição da branch padrão, então o ci-metrics
  # migrado só roda de verdade depois do merge. Mesmos passos e argumentos dele, sobre o último run concluído do ci da branch em que o smoke roda.
  metrics:
    needs: smoke
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, linux, x64, cantina-ci]
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/metrics
            scripts/ci/lib
            .github/workflows/ci.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Último run concluído do ci desta branch
        id: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          id=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$GITHUB_REF_NAME&status=completed&per_page=1" | jq -r '.workflow_runs[0].id // empty')
          [ -n "$id" ] || { echo "nenhum run concluído do ci nesta branch"; exit 1; }
          echo "run=$id" >> "$GITHUB_OUTPUT"
      - name: Coletar métricas do run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.target.outputs.run }}
        run: node scripts/ci/metrics/collect.ts --repo "$GITHUB_REPOSITORY" --run "$CI_RUN_ID" --out ci-metrics --history 30 --collector-run "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metrics-ensaio-${{ github.run_id }}
          path: ci-metrics/
          if-no-files-found: error
          retention-days: 7
