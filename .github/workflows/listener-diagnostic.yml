# Experimento dirigido do atraso de listener (homologação). NÃO é gate: workflow separado do `ci`, só roda por push nesta
# branch de diagnóstico e nunca bloqueia nem substitui os checks exigidos. Usa a homologação cantina-escolar-hml com uma
# conta fictícia PRÓPRIA do diagnóstico (sem perfil no app) e o documento foundationProbes/{uid} dessa conta; não toca
# carteiras, créditos, pagamentos nem Rules. Credenciais só pelos secrets do ambiente `diagnostico-listener` (restrito a esta
# branch); nada é impresso nem vai para artefato. Plano fixo: 3 rodadas × escritas 2, 10 e 35 s após a inscrição = 9 rodadas.
name: diagnostico-listener

on:
  push:
    branches: [diagnostico/listener-ci-hml]
    paths:
      - .github/workflows/listener-diagnostic.yml
      - tools/listener-repro/ci-run.ts

permissions:
  contents: read

concurrency:
  group: diagnostico-listener
  cancel-in-progress: false

jobs:
  rodada:
    name: rodada ${{ matrix.round }} · escrita ${{ matrix.delay }} s
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: diagnostico-listener
    strategy:
      fail-fast: false
      max-parallel: 1 # uma por vez, intercaladas por rodada (2, 10, 35 s; 2, 10, 35 s; ...): reduz o efeito do horário
      matrix:
        round: [1, 2, 3]
        delay: [2, 10, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vite build -c tools/listener-repro/vite.config.ts
      - name: Rodada (escrita ${{ matrix.delay }} s após a inscrição)
        env:
          DIAG_PROJECT_ID: cantina-escolar-hml
          DIAG_EMAIL: listener-diag@hml.example.test
          DIAG_API_KEY: ${{ secrets.HML_FIREBASE_API_KEY }}
          DIAG_APP_ID: ${{ secrets.HML_FIREBASE_APP_ID }}
          DIAG_PASSWORD: ${{ secrets.DIAG_PASSWORD }}
          DIAG_SA_B64: ${{ secrets.HML_SERVICE_ACCOUNT_B64 }}
          DIAG_WRITE_AFTER_MS: ${{ matrix.delay }}000
          DIAG_ROUND: ${{ matrix.round }}
          DIAG_OUT: diag-out
        run: node tools/listener-repro/ci-run.ts
      - uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.delay }}s-r${{ matrix.round }}
          path: diag-out/*.json
          if-no-files-found: error
          retention-days: 30
