# PROBE TEMPORÁRIO (branch descartável ci/probe-infra; nunca mesclado). Comprova no Actions real o que não dá para provar
# localmente: classificação com eventos reais, artefato do build por tentativa, reexecução só do job falho, reconstrução,
# formas reais de needs.*.result e o contexto job.check_run_id. Sem segredos; Vercel desligada para ci/probe-* (vercel.json).
name: probe-infra

on:
  push:
    branches: [ci/probe-infra]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      p3fail: ${{ contains(github.event.head_commit.message, '[p3-falha]') }}
      p1: ${{ contains(github.event.head_commit.message, '[p1]') }}
      p2: ${{ contains(github.event.head_commit.message, '[p2]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Referência validada
        id: reference
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/reference-sha.ts
      - name: Classificar mudanças (evento push real)
        id: classify
        env:
          BASE: ${{ steps.reference.outputs.base }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          echo "before=$PUSH_BEFORE referencia=$BASE head=$GITHUB_SHA"
          node scripts/ci/classify-changes.ts --base "$BASE" --head "$GITHUB_SHA"
      - name: Contexto do job (link do log)
        env:
          CHECK_RUN_ID: ${{ job.check_run_id }}
        run: echo "job.check_run_id=$CHECK_RUN_ID"

  # ---------- P1: build real -> artefato por tentativa -> consumidor -> rerun do falho -> reconstrução ----------
  p1-build:
    needs: changes
    if: needs.changes.outputs.p1 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.pack.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/ci/build-manifest.ts env >> "$GITHUB_ENV"
      - run: npm run build
      - name: Conteúdo do .next (inspeção do que é diagnóstico)
        run: |
          du -sh .next/* .next/server/* 2>/dev/null | sort -h | tail -20
          ls -la .next
      - name: Empacotar build + manifesto
        id: pack
        run: |
          name="build-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          node scripts/ci/build-manifest.ts pack --out build-artifact --name "$name" --build-command "npm run build"
          echo "artifact=$name" >> "$GITHUB_OUTPUT"
          cat build-artifact/manifest.json
      - name: (diagnóstico do probe) Gitleaks no .next inteiro, inclusive cache
        continue-on-error: true
        run: |
          bash scripts/ci/tools/install-gitleaks.sh "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/gitleaks" dir --redact --no-banner -v .next
      - name: Gitleaks no pacote do build
        run: |
          mkdir -p "$RUNNER_TEMP/pacote" && tar -xzf build-artifact/build.tar.gz -C "$RUNNER_TEMP/pacote"
          "$RUNNER_TEMP/bin/gitleaks" dir --redact --no-banner -v --config scripts/ci/gitleaks-build.toml "$RUNNER_TEMP/pacote"
      - name: Controle negativo da exceção (segredo injetado numa CÓPIA precisa reprovar)
        run: |
          for caso in outro-arquivo mesma-chave-outro-arquivo; do
            rm -rf "$RUNNER_TEMP/neg" && cp -r "$RUNNER_TEMP/pacote" "$RUNNER_TEMP/neg"
            if [ "$caso" = outro-arquivo ]; then
              jq -n --arg v "$(openssl rand -hex 24)" '{apiKey: $v}' > "$RUNNER_TEMP/neg/.next/server/injetado.json"
            else
              jq -n --arg v "$(openssl rand -base64 32)" '{encryptionKey: $v}' > "$RUNNER_TEMP/neg/.next/server/outro-manifest.json"
            fi
            if "$RUNNER_TEMP/bin/gitleaks" dir --redact --no-banner --config scripts/ci/gitleaks-build.toml "$RUNNER_TEMP/neg"; then
              echo "::error::controle negativo '$caso' NÃO foi detectado"; exit 1
            else
              echo "controle negativo '$caso': detectado (esperado)"
            fi
          done
      - name: "Artefato: enviar build"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pack.outputs.artifact }}
          path: build-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  p1-consume:
    needs: [changes, p1-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: "Artefato: baixar build"
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.p1-build.outputs.artifact }}
          path: build-artifact
      - name: Validar manifesto e extrair
        run: node scripts/ci/build-manifest.ts verify --dir build-artifact
      # Fumaça só na 1ª tentativa: o .next extraído sobe com next start (sem recompilar) e responde.
      - name: npm ci (fumaça)
        if: github.run_attempt == '1'
        run: npm ci
      - name: next start sobre o build compartilhado
        if: github.run_attempt == '1'
        run: |
          node scripts/ci/build-manifest.ts env > "$RUNNER_TEMP/env"
          set -a; . "$RUNNER_TEMP/env"; set +a
          export FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 STORAGE_LOCAL_DIR=.local-storage/probe PAYMENTS_PIX_PROVIDER=demo PAYMENTS_CARD_PROVIDER=demo
          node scripts/ci/timed-server.ts start > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/ || true); [ "$code" != "000" ] && break; sleep 1; done
          echo "GET / -> $code"; cat ci-results/server-ready-*.json || true; tail -5 "$RUNNER_TEMP/server.log"
          [ "$code" -ge 200 ] && [ "$code" -lt 400 ]
      - name: Falha controlada só na tentativa 1 (probe de reexecução)
        if: github.run_attempt == '1'
        run: |
          echo "::error::Falha CONTROLADA do probe P1 (tentativa 1) para comprovar a reexecução só do job falho."
          exit 1

  p1-gate:
    needs: [changes, p1-build, p1-consume]
    if: always() && needs.changes.outputs.p1 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: needs reais
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"

  # ---------- P2: formas reais de needs.*.result para o gate ----------
  p2-ok:
    needs: changes
    if: needs.changes.outputs.p2 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo ok
  p2-falha:
    needs: changes
    if: needs.changes.outputs.p2 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: exit 1
  p2-pulado:
    needs: changes
    if: needs.changes.outputs.p2 == 'never'
    runs-on: ubuntu-24.04
    steps:
      - run: echo nunca
  p2-tempo:
    needs: changes
    if: needs.changes.outputs.p2 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: sleep 120
  p2-dependente:
    needs: [changes, p2-falha]
    if: needs.changes.outputs.p2 == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo nunca
  p2-gate:
    needs: [changes, p2-ok, p2-falha, p2-pulado, p2-tempo, p2-dependente]
    if: always() && needs.changes.outputs.p2 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: needs reais
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"
  p3-falha:
    needs: changes
    if: needs.changes.outputs.p3fail == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: exit 1
  # P4/P5 (recusa): o MESMO scripts/ci/require-config.ts do ci.yml, com os mesmos secrets/variáveis (hoje inexistentes).
  recusa-config:
    needs: changes
    if: contains(github.event.head_commit.message, '[p45]')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Recusas esperadas (configuração ausente reprova) e presença do Semgrep
        env:
          VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
          SRCCLR_API_TOKEN: ${{ secrets.SRCCLR_API_TOKEN }}
          VERACODE_REGION: ${{ vars.VERACODE_REGION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          expect_fail() { if node scripts/ci/require-config.ts "$@"; then echo "::error::esperava recusa: $1"; exit 1; else echo "recusado (esperado): $1"; fi; }
          expect_fail "Veracode Pipeline Scan" VERACODE_API_ID VERACODE_API_KEY VERACODE_REGION=commercial
          expect_fail "Veracode SCA" SRCCLR_API_TOKEN VERACODE_REGION=commercial
          expect_fail "SonarQube Cloud" SONAR_TOKEN SONAR_ORGANIZATION SONAR_PROJECT_KEY
          node scripts/ci/require-config.ts "Semgrep AppSec" SEMGREP_APP_TOKEN
  # P4: Veracode com credenciais — os MESMOS scripts do ci.yml; pacote real e pacote com arquivo semeado (só no ZIP).
  p4-veracode:
    needs: changes
    if: contains(github.event.head_commit.message, '[p4]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Pipeline Scan — pacote real
        env:
          VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
          VERACODE_REGION: ${{ vars.VERACODE_REGION }}
          VERACODE_OUT: veracode-real
        run: bash scripts/ci/veracode-sast.sh
      - name: Pipeline Scan — pacote com vulnerabilidade semeada (só no ZIP)
        if: ${{ !cancelled() }}
        env:
          VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
          VERACODE_REGION: ${{ vars.VERACODE_REGION }}
          VERACODE_OUT: veracode-seed
        run: |
          seed="$RUNNER_TEMP/seed/src/app/api/probe-semeado"
          mkdir -p "$seed"
          cat > "$seed/route.ts" <<'TS'
          import { exec } from "node:child_process";
          import type { NextRequest } from "next/server";

          type Comando = { cmd: string; expr: string };

          export async function GET(request: NextRequest) {
            const params = request.nextUrl.searchParams;
            const entrada = { cmd: params.get("cmd") ?? "", expr: params.get("expr") ?? "0" } satisfies Comando;
            exec(entrada.cmd);
            return new Response(String(eval(entrada.expr)));
          }
          TS
          VERACODE_SEED_DIR="$RUNNER_TEMP/seed" bash scripts/ci/veracode-sast.sh || true
          node -e '
            const r = require("./veracode-seed/results.json");
            const hits = (r.findings || []).filter((f) => JSON.stringify(f.files || {}).includes("probe-semeado"));
            console.log("achados no arquivo semeado:", JSON.stringify(hits.map((f) => ({ sev: f.severity, cwe: f.cwe_id, title: f.title || f.issue_type }))));
            if (!hits.length) { console.log("::error::vulnerabilidade semeada NÃO detectada"); process.exit(1); }
          '
      - name: SCA — agente, --no-upload
        if: ${{ !cancelled() }}
        env:
          SRCCLR_API_TOKEN: ${{ secrets.SRCCLR_API_TOKEN }}
          VERACODE_REGION: ${{ vars.VERACODE_REGION }}
          VERACODE_OUT: veracode-sca
        run: bash scripts/ci/veracode-sca.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: p4-veracode-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            veracode-real/*.json
            veracode-seed/*.json
            veracode-sca/*.json
            ci-results/veracode-*.json
          retention-days: 7

  # P5: análise INICIAL da main no SonarQube Cloud (referência para os PRs). A main ainda não tem a instrumentação de
  # cobertura (vem neste PR), então esta análise é SEM cobertura — registrado; as próximas análises da main terão LCOV real.
  p5-sonar-main:
    needs: changes
    if: contains(github.event.head_commit.message, '[p5main]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Configuração do SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: node scripts/ci/require-config.ts "SonarQube Cloud" SONAR_TOKEN SONAR_ORGANIZATION SONAR_PROJECT_KEY
      - name: SonarQube Cloud — main (sem cobertura)
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: main
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.branch.name=main
            -Dsonar.sources=src,scripts
            -Dsonar.exclusions=**/*.d.ts
            -Dsonar.tests=tests
            -Dsonar.test.inclusions=tests/**/*.ts,tests/**/*.tsx
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
      - name: Resultado efetivo do Quality Gate
        if: ${{ !cancelled() }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node scripts/ci/sonar-gate.ts main/.scannerwork/report-task.txt
