# CI da Cantina Escolar. Nunca usa credencial real: só emuladores com projeto demo-cantina.
# Executado no GitHub Actions desde 01/10/2026 (repositório privado JuanCunhaa/cantina-escolar).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rules
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Build PADRÃO (Turbopack, SWC nativo disponível no Linux). Localmente só o build webpack foi comprovado;
      # este passo é a primeira prova do build padrão e só vale quando o CI for de fato executado.
      - run: npm run build
        env:
          APP_ENV: emulator
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "true"
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-cantina.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-cantina
          NEXT_PUBLIC_FIREBASE_APP_ID: demo-app
          FIREBASE_PROJECT_ID: demo-cantina
      - run: npm run audit:prod

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks v8.30.1 (binário fixado, SHA-256 conferido)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          ./gitleaks git --redact --no-banner .
          ./gitleaks dir --redact --no-banner .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Versão fixada na 1ª execução real do CI (01/10/2026); as regras de --config=auto vêm do registry e podem mudar.
      - name: Semgrep 1.179.0 (regras do registry)
        run: |
          pip install semgrep==1.179.0
          semgrep scan --config=auto --error src
