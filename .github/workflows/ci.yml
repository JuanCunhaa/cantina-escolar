# CI da Cantina Escolar. Nunca usa credencial da aplicação: só emuladores com projeto demo-cantina e dados fictícios.
# Desenho, comandos de reprodução e reexecução: docs/testing/ci.md. O gate final é o job `check` (scripts/ci/gate.ts).
#
#   changes ─┬─ fast ──────────────┬─ quality ─┐
#            ├─ backend ───────────┘           │
#            ├─ build ── e2e (g1, g2) ─────────┼─ check (sempre roda; aprova só o esperado para o modo)
#            ├─ security / semgrep-appsec ─────┘
#
# Modo `docs` (só PROGRESS.md/docs/status/*.md): roda changes, fast (JSON estruturado) e security (Gitleaks); o restante
# fica `skipped` e o check exige exatamente isso. Qualquer dúvida na classificação => modo `full`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Classificar mudanças (lista documental explícita)
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          node scripts/ci/classify-changes.ts --base "$base" --head "$GITHUB_SHA"

  fast:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MODE: ${{ needs.changes.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ${{ needs.changes.outputs.mode == 'full' && 'npm' || '' }}
      - name: Documentos estruturados (JSON válido)
        run: node scripts/ci/validate-structured.ts
      - name: npm ci
        id: install
        if: env.MODE == 'full'
        run: npm ci
      - name: actionlint (workflows)
        if: ${{ !cancelled() && env.MODE == 'full' }}
        run: |
          bash scripts/ci/tools/install-actionlint.sh "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/actionlint" -color
      - name: Partição e2e (grupos cobrem a suíte obrigatória)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci/e2e-groups.ts verify
      # lint, typecheck e unit rodam mesmo se um anterior falhar: todas as falhas aparecem na mesma execução.
      - name: npm run lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: npm run typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: npm test (unit, com cobertura)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --coverage --reporter=default --reporter=json --outputFile.json=ci-results/vitest-unit.json
      - name: Resumo da suíte unit
        if: ${{ !cancelled() && env.MODE == 'full' }}
        run: node scripts/ci/test-report.ts vitest ci-results/vitest-unit.json --suite unit --log-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: "Artefato: resumo unit"
        if: ${{ !cancelled() && env.MODE == 'full' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-summary-unit-a${{ github.run_attempt }}
          path: ci-results/summary-unit.json
          if-no-files-found: error
          retention-days: 30
      - name: "Artefato: cobertura unit"
        if: ${{ !cancelled() && env.MODE == 'full' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit-${{ github.run_id }}-a${{ github.run_attempt }}
          path: coverage/unit/lcov.info
          if-no-files-found: error
          retention-days: 1
    outputs:
      coverage: coverage-unit-${{ github.run_id }}-a${{ github.run_attempt }}

  backend:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: npm ci
        id: install
        run: npm ci
      # Mesmos comandos de npm run test:rules / test:integration, com relatório JSON e cobertura (só integração executa src/).
      - name: Rules (emulador)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx firebase emulators:exec --only auth,firestore --project demo-cantina "npx vitest run --config vitest.rules.config.ts --reporter=default --reporter=json --outputFile.json=ci-results/vitest-rules.json"
      - name: Integração (emulador, com cobertura)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx firebase emulators:exec --only auth,firestore --project demo-cantina "npx vitest run --config vitest.integration.config.ts --coverage --reporter=default --reporter=json --outputFile.json=ci-results/vitest-integration.json"
      - name: Resumos das suítes
        if: ${{ !cancelled() }}
        run: |
          log="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          status=0
          node scripts/ci/test-report.ts vitest ci-results/vitest-rules.json --suite rules --log-url "$log" || status=1
          node scripts/ci/test-report.ts vitest ci-results/vitest-integration.json --suite integration --log-url "$log" || status=1
          exit $status
      - name: "Artefato: resumos backend"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-summary-backend-a${{ github.run_attempt }}
          path: ci-results/summary-*.json
          if-no-files-found: error
          retention-days: 30
      - name: "Artefato: cobertura integração"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration-${{ github.run_id }}-a${{ github.run_attempt }}
          path: coverage/integration/lcov.info
          if-no-files-found: error
          retention-days: 1
      - name: Evidências do backend (logs dos emuladores)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-evidencias-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-results/
            *-debug.log
          if-no-files-found: warn
          retention-days: 7
    outputs:
      coverage: coverage-integration-${{ github.run_id }}-a${{ github.run_attempt }}

  build:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.pack.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ambiente hermético do build (emulador, valores fictícios)
        run: node scripts/ci/build-manifest.ts env >> "$GITHUB_ENV"
      # Build PADRÃO (Turbopack), o mesmo comando da Vercel; o .next resultante é o que os grupos e2e executam.
      - run: npm run build
      - name: Empacotar build + manifesto
        id: pack
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          name="build-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          node scripts/ci/build-manifest.ts pack --out build-artifact --name "$name" --build-command "npm run build"
          echo "artifact=$name" >> "$GITHUB_OUTPUT"
      # Varre EXATAMENTE o conteúdo que será enviado (pacote extraído à parte), com achados detalhados e segredo mascarado.
      # Única exceção (revisada): chaves por build do Next exigidas pelo next start (scripts/ci/gitleaks-build.toml).
      - name: Gitleaks no pacote do build
        run: |
          bash scripts/ci/tools/install-gitleaks.sh "$RUNNER_TEMP/bin"
          mkdir -p "$RUNNER_TEMP/pacote" && tar -xzf build-artifact/build.tar.gz -C "$RUNNER_TEMP/pacote"
          "$RUNNER_TEMP/bin/gitleaks" dir --redact --no-banner -v --config scripts/ci/gitleaks-build.toml "$RUNNER_TEMP/pacote"
      - name: "Artefato: enviar build"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pack.outputs.artifact }}
          path: build-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  e2e:
    name: e2e (${{ matrix.group }})
    needs: [changes, build]
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [g1, g2]
    env:
      E2E_SERVER_MODE: start
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: "Artefato: baixar build"
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: build-artifact
      - name: Build ausente ou expirado
        if: failure() && steps.download.outcome == 'failure'
        env:
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: |
          echo "::error::Artefato $ARTIFACT ausente ou expirado (retenção de 1 dia). Reexecute o job build deste run: ele gera um novo artefato do MESMO commit e reexecuta os grupos e2e e o check."
          exit 1
      - name: Validar manifesto e extrair o build (mesmo run e commit)
        run: node scripts/ci/build-manifest.ts verify --dir build-artifact
      - name: Listar testes (suíte e grupo)
        id: list
        run: node scripts/ci/e2e-groups.ts verify --list
      - run: npx playwright install --with-deps chromium
      - name: Recursos do runner (início do e2e)
        continue-on-error: true
        run: |
          mkdir -p ci-diagnostics
          bash scripts/ci/resource-snapshot.sh inicio-e2e >> ci-diagnostics/resources.txt
      - name: e2e ${{ matrix.group }} (emuladores e servidor próprios)
        id: e2e
        run: node scripts/ci/e2e-groups.ts run "${{ matrix.group }}"
      - name: Recursos do runner (fim do e2e)
        continue-on-error: true
        if: always()
        run: bash scripts/ci/resource-snapshot.sh "fim-e2e-${{ steps.e2e.outcome }}" >> ci-diagnostics/resources.txt
      - name: Resumo do grupo
        if: ${{ !cancelled() && steps.list.outcome == 'success' }}
        env:
          EXPECTED: ${{ matrix.group == 'g1' && steps.list.outputs.expected_g1 || steps.list.outputs.expected_g2 }}
          EXPECTED_TOTAL: ${{ steps.list.outputs.expected_total }}
          GROUP: ${{ matrix.group }}
        run: node scripts/ci/test-report.ts playwright "ci-results/playwright-$GROUP.json" --suite "e2e-$GROUP" --expected "$EXPECTED" --expected-total "$EXPECTED_TOTAL" --log-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: "Artefato: resumo do grupo"
        if: ${{ !cancelled() && steps.list.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-summary-e2e-${{ matrix.group }}-a${{ github.run_attempt }}
          path: ci-results/summary-e2e-${{ matrix.group }}.json
          if-no-files-found: error
          retention-days: 30
      # Propagação entre sessões pelo listener (carteira, F08): diagnóstico NÃO bloqueante, registrado à parte, com o timeout
      # padrão. Fica no g2 (mesmo ambiente isolado); a falha aparece no passo e no resumo, sem entrar no gate.
      - name: e2e — propagação entre sessões (listener, não bloqueante)
        if: ${{ matrix.group == 'g2' && !cancelled() && steps.e2e.outcome != 'skipped' }}
        continue-on-error: true
        env:
          E2E_REPORT: propagation
        run: npm run test:e2e:propagation
      - name: Evidências do e2e (resultados, error-context, relatório)
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-evidencias-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            ci-diagnostics/
            ci-results/
          if-no-files-found: warn
          retention-days: 7

  security:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODE: ${{ needs.changes.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks v8.30.1 (histórico e diretório)
        run: |
          bash scripts/ci/tools/install-gitleaks.sh "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner .
          "$RUNNER_TEMP/bin/gitleaks" dir --redact --no-banner .
      # Os passos abaixo rodam no modo full e independentemente uns dos outros (todos os achados na mesma execução).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !cancelled() && env.MODE == 'full' }}
        with:
          node-version: 24
      - name: npm audit (produção, a partir do lockfile)
        if: ${{ !cancelled() && env.MODE == 'full' }}
        run: npm audit --omit=dev --audit-level=high --package-lock-only
      # Semgrep permanece até o Veracode ser validado (docs/testing/ci.md). Versão fixada; regras do registry podem mudar.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !cancelled() && env.MODE == 'full' }}
        with:
          python-version: "3.13"
      - name: Semgrep 1.179.0 (regras do registry)
        if: ${{ !cancelled() && env.MODE == 'full' }}
        run: |
          pip install semgrep==1.179.0
          semgrep scan --config=auto --error src
      # Veracode Pipeline Scan (SAST): o pacote do FONTE (git archive do commit testado; sem .env, node_modules, .next, testes)
      # é enviado ao motor remoto da Veracode para análise; os resultados voltam ao job e NÃO são publicados na plataforma
      # (sem Upload and Scan, sem importação de resultados). Imagem oficial versionada e fixada por digest.
      - name: Veracode Pipeline Scan (SAST)
        if: ${{ !cancelled() && env.MODE == 'full' }}
        env:
          VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
          VERACODE_REGION: ${{ vars.VERACODE_REGION }}
        run: |
          if [ -z "$VERACODE_API_ID" ] || [ -z "$VERACODE_API_KEY" ]; then echo "::error::Credenciais Veracode ausentes (VERACODE_API_ID/VERACODE_API_KEY): SAST não executado — reprovado."; exit 1; fi
          if [ "$VERACODE_REGION" != "commercial" ]; then echo "::error::VERACODE_REGION='$VERACODE_REGION' não confirmada para o Pipeline Scan (aceito: commercial). Reprovado até configurar."; exit 1; fi
          mkdir -p veracode && git archive --format=zip -o veracode/sast.zip HEAD -- src package.json package-lock.json tsconfig.json next.config.ts
          unzip -l veracode/sast.zip | tail -1
          umask 077 && mkdir -p "$RUNNER_TEMP/veracode" && printf '[default]\nveracode_api_key_id = %s\nveracode_api_key_secret = %s\n' "$VERACODE_API_ID" "$VERACODE_API_KEY" > "$RUNNER_TEMP/veracode/credentials"
          status=0
          docker run --rm -v "$PWD/veracode:/scan" -v "$RUNNER_TEMP/veracode:/root/.veracode:ro" -w /scan \
            veracode/pipeline-scan@sha256:894fd6d68bb2b2177f1a6931806be426e547ec627a5e750e3d938b23752676da \
            --file sast.zip --fail_on_severity="Very High, High" --json_output_file results.json || status=$?
          rm -f "$RUNNER_TEMP/veracode/credentials"
          echo "Pipeline Scan terminou com código $status"
          node scripts/ci/veracode-report.ts sast veracode/results.json
      # Veracode SCA (agente) com --no-upload: os resultados não são publicados na plataforma; a análise NÃO é offline
      # (o agente consulta o serviço da Veracode para a base de vulnerabilidades). Critério avaliado localmente.
      - name: Veracode SCA (agente, --no-upload)
        if: ${{ !cancelled() && env.MODE == 'full' }}
        env:
          SRCCLR_API_TOKEN: ${{ secrets.SRCCLR_API_TOKEN }}
          VERACODE_REGION: ${{ vars.VERACODE_REGION }}
        run: |
          if [ -z "$SRCCLR_API_TOKEN" ]; then echo "::error::SRCCLR_API_TOKEN ausente: SCA não executado — reprovado."; exit 1; fi
          if [ "$VERACODE_REGION" != "commercial" ]; then echo "::error::VERACODE_REGION='$VERACODE_REGION' não confirmada para o SCA (aceito: commercial). Reprovado até configurar."; exit 1; fi
          bash scripts/ci/tools/install-srcclr.sh
          mkdir -p veracode
          npm ls --omit=dev --all --json --package-lock-only > veracode/npm-ls-prod.json || true
          srcclr scan . --no-upload --json=veracode/sca.json
          node scripts/ci/veracode-report.ts sca veracode/sca.json veracode/npm-ls-prod.json
      - name: "Artefato: relatórios de segurança"
        if: ${{ !cancelled() && env.MODE == 'full' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-relatorios-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            veracode/results.json
            veracode/filtered_results.json
            veracode/sca.json
            ci-results/veracode-*.json
          if-no-files-found: warn
          retention-days: 30

  # Semgrep AppSec Platform (transitório, até a substituição pelo Veracode ser validada). Job isolado porque o `semgrep ci`
  # diff-aware busca commits com o GITHUB_TOKEN (contents: read, só neste job). Sem o segredo, REPROVA (não aprova em silêncio).
  semgrep-appsec:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Semgrep CI (AppSec Platform)
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -z "$SEMGREP_APP_TOKEN" ]; then echo "::error::SEMGREP_APP_TOKEN indisponível: semgrep ci não executado — reprovado."; exit 1; fi
          pip install semgrep==1.179.0
          semgrep ci

  # SonarQube Cloud (plano Free, Quality Gate disponível no plano). O scanner ENVIA o código-fonte e a cobertura ao serviço.
  # Cobertura real: LCOV de unit + integração (Rules não executa src/; e2e não é instrumentado). Análise automática do
  # SonarQube Cloud deve ficar DESLIGADA para não duplicar (configuração externa).
  quality:
    needs: [changes, fast, backend]
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: "Artefato: cobertura unit"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.fast.outputs.coverage }}
          path: coverage/unit
      - name: "Artefato: cobertura integração"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.backend.outputs.coverage }}
          path: coverage/integration
      - name: Mesclar LCOV (unit + integração)
        run: node scripts/ci/lcov-merge.ts --out coverage/merged/lcov.info unit=coverage/unit/lcov.info integration=coverage/integration/lcov.info
      - name: Configuração do SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          missing=""
          [ -n "$SONAR_TOKEN" ] || missing="$missing SONAR_TOKEN"
          [ -n "$SONAR_ORGANIZATION" ] || missing="$missing SONAR_ORGANIZATION"
          [ -n "$SONAR_PROJECT_KEY" ] || missing="$missing SONAR_PROJECT_KEY"
          if [ -n "$missing" ]; then echo "::error::Configuração do SonarQube Cloud ausente:$missing — análise não executada, reprovado."; exit 1; fi
      - name: SonarQube Cloud (análise + espera do Quality Gate)
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
      - name: Resultado efetivo do Quality Gate
        if: ${{ !cancelled() }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node scripts/ci/sonar-gate.ts .scannerwork/report-task.txt

  check:
    needs: [changes, fast, backend, build, e2e, security, semgrep-appsec, quality]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Resumos de todas as tentativas deste run; o gate usa o mais recente por suíte e reprova o que faltar.
      - name: "Artefato: resumos das suítes"
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-summary-*
          path: ci-summaries
      - name: Gate final
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/gate.ts --summaries ci-summaries --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
