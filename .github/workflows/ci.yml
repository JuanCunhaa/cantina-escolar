# CI da Cantina Escolar. Nunca usa credencial real: só emuladores com projeto demo-cantina.
# Executado no GitHub Actions desde 01/10/2026 (repositório privado JuanCunhaa/cantina-escolar).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rules
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - name: Recursos do runner (início do e2e)
        run: |
          mkdir -p ci-diagnostics
          scripts/ci/resource-snapshot.sh inicio-e2e >> ci-diagnostics/resources.txt
      - name: npm run test:e2e
        id: e2e
        run: npm run test:e2e
      # Observabilidade (só diagnóstico): recursos ao terminar e evidências do Playwright quando o e2e FALHA. O passo de testes
      # segue definindo o status do job; estes passos não o mascaram. Só dados fictícios do emulador (nada de .env/segredos).
      - name: Recursos do runner (fim do e2e)
        if: always()
        run: scripts/ci/resource-snapshot.sh fim-e2e-${{ steps.e2e.outcome }} >> ci-diagnostics/resources.txt
      - name: Evidências do e2e (resultados, error-context, relatório e traces)
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidencias-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      # Propagação entre sessões pelo listener (carteira, F08): registrada À PARTE, com o timeout padrão. Não bloqueia o
      # check enquanto o dono não decidir (PR #4/#5: atraso de listener inconclusivo); a falha fica visível no passo.
      - name: e2e — propagação entre sessões (listener, não bloqueante)
        run: npm run test:e2e:propagation
        continue-on-error: true
      # Build PADRÃO (Turbopack, SWC nativo disponível no Linux). Localmente só o build webpack foi comprovado;
      # este passo é a primeira prova do build padrão e só vale quando o CI for de fato executado.
      - run: npm run build
        env:
          APP_ENV: emulator
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "true"
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-cantina.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-cantina
          NEXT_PUBLIC_FIREBASE_APP_ID: demo-app
          FIREBASE_PROJECT_ID: demo-cantina
      - run: npm run audit:prod

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks v8.30.1 (binário fixado, SHA-256 conferido)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          ./gitleaks git --redact --no-banner .
          ./gitleaks dir --redact --no-banner .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Versão fixada na 1ª execução real do CI (01/10/2026); as regras de --config=auto vêm do registry e podem mudar.
      - name: Semgrep 1.179.0 (regras do registry)
        run: |
          pip install semgrep==1.179.0
          semgrep scan --config=auto --error src

  # Semgrep AppSec Platform: políticas do painel, resultados enviados à conta do dono. Job isolado porque o `semgrep ci`
  # diff-aware de PR busca commits (git fetch) no repositório privado: só aqui o checkout mantém o GITHUB_TOKEN
  # (permissions: contents: read, válido só durante o job) e nenhum outro passo roda neste job. Sem o segredo (ex.: PR
  # do Dependabot) a etapa avisa e não roda; o scan do job security continua obrigatório.
  semgrep-appsec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Semgrep CI (AppSec Platform)
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -z "$SEMGREP_APP_TOKEN" ]; then echo "::warning::SEMGREP_APP_TOKEN indisponível; semgrep ci não executado."; exit 0; fi
          pip install semgrep==1.179.0
          semgrep ci
