# SonarQube Cloud (plano Free). Organização e chave do projeto vêm das variáveis do repositório (SONAR_ORGANIZATION,
# SONAR_PROJECT_KEY) no job quality do CI; a análise automática do serviço deve ficar desligada (análise só pelo CI).
# O scanner envia o código-fonte e a cobertura ao SonarQube Cloud.
sonar.sourceEncoding=UTF-8
# Fonte original (sem bundles do .next, sem node_modules)
sonar.sources=src,scripts
sonar.exclusions=**/*.d.ts
# Testes identificados separadamente
sonar.tests=tests
sonar.test.inclusions=tests/**/*.ts,tests/**/*.tsx
# Cobertura real: LCOV mesclado de unit + integração (scripts/ci/lcov-merge.ts)
sonar.javascript.lcov.reportPaths=coverage/merged/lcov.info
